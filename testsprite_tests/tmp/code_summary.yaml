version: "2"
type: frontend
tech_stack:
  - Python 3.11.3
  - Django 4.2
  - MySQL
  - Bootstrap 5.3
  - jQuery 3.6
  - DataTables 1.13.5
  - Font Awesome
  - Notyf
routes:
  - path: /login/
    file: authentication/templates/accounts/login.html
    auth_required: false
    description: Login page with user_id and password
  - path: /
    file: apps/templates/index.html
    auth_required: true
    description: Home/Dashboard page
  - path: /dashboard/
    file: apps/templates/index.html
    auth_required: true
    description: Dashboard page
  - path: /master/goat-type/
    file: apps/templates/master/goat_type_index.html
    auth_required: true
    description: Goat Type master data list
  - path: /master/goat-type/add/
    file: apps/templates/master/goat_type_add.html
    auth_required: true
    description: Add new goat type
  - path: /master/goat-type/view/<id>/
    file: apps/templates/master/goat_type_view.html
    auth_required: true
    description: View goat type details
  - path: /master/goat-type/update/<id>/
    file: apps/templates/master/goat_type_update.html
    auth_required: true
    description: Update goat type
  - path: /master/goat-type/delete/<id>/
    file: apps/templates/master/goat_type_delete.html
    auth_required: true
    description: Delete goat type
  - path: /jadwal/
    file: apps/templates/jadwal/jadwal_index.html
    auth_required: true
    description: Order schedule list
  - path: /jadwal/events/
    file: apps/templates/jadwal/jadwal_events.html
    auth_required: true
    description: Calendar events for schedule
  - path: /jadwal/reminders/
    file: apps/templates/jadwal/jadwal_reminders.html
    auth_required: true
    description: Schedule reminders and notifications
  - path: /jadwal/save/<order_id>/
    file: apps/templates/jadwal/jadwal_save.html
    auth_required: true
    description: Save/update schedule for an order
features:
  - name: User Login with Auto-Schedule
    description: Login with user_id and password. On successful login, automatically schedules Confirmed orders from the last 3 months that are not yet in the schedule.
    files:
      - authentication/templates/accounts/login.html
      - authentication/views.py
      - apps/models.py
    entry_route: /login/
    user_interactions:
      - Fill user_id input field
      - Fill password input field
      - Click Login button to submit
      - See dashboard on success or error message on invalid credentials
      - Backend automatically updates schedule_status to SCHEDULED for eligible Confirmed orders
    api_calls:
      - method: POST
        endpoint: /login/
    auth_required: false

  - name: Dashboard View
    description: View operational dashboard with order status widgets and notifications
    files:
      - apps/templates/index.html
      - apps/views.py
    entry_route: /
    user_interactions:
      - Navigate to dashboard after login
      - View Today's Orders widget
      - View Unscheduled orders count
      - View Cooking orders count
      - View Packing orders count
      - View Ready orders count
      - View On Delivery count
      - View Completed count
      - View sidebar notification badge
    api_calls:
      - method: GET
        endpoint: /
    auth_required: true

  - name: Reminder System
    description: View reminders for overdue schedules, missing drivers, and packing status
    files:
      - apps/templates/jadwal/jadwal_reminders.html
      - apps/views.py
    entry_route: /jadwal/reminders/
    user_interactions:
      - Click reminder bell icon in sidebar
      - View list of overdue schedules
      - View missing driver assignments
      - View incomplete packing status
      - Click a reminder to navigate to the schedule
      - Close reminder dropdown
    api_calls:
      - method: GET
        endpoint: /jadwal/reminders/
    auth_required: true

  - name: Order Schedule List
    description: View and manage daily order schedules with filtering
    files:
      - apps/templates/jadwal/jadwal_index.html
      - apps/views.py
    entry_route: /jadwal/
    user_interactions:
      - View schedule list table with default filter (today)
      - Filter by delivery date
      - Filter by event date
      - Filter by customer name
      - Filter by driver
      - Filter by status
      - Filter by region
      - Filter by branch
      - Filter by goat type
      - Search schedule by keyword
      - Click a schedule row to view details
      - Change schedule status via dropdown
      - Assign driver to a schedule
    api_calls:
      - method: GET
        endpoint: /jadwal/
      - method: POST
        endpoint: /jadwal/save/<order_id>/
    auth_required: true

  - name: Schedule Calendar View
    description: View schedules in calendar format
    files:
      - apps/templates/jadwal/jadwal_events.html
      - apps/views.py
    entry_route: /jadwal/events/
    user_interactions:
      - Switch to calendar view
      - View orders by date on calendar
      - Click a calendar event to see details
      - Navigate between months
    api_calls:
      - method: GET
        endpoint: /jadwal/events/
    auth_required: true

  - name: Goat Type Master CRUD
    description: Manage goat type master data - Create, Read, Update, Delete
    files:
      - apps/templates/master/goat_type_index.html
      - apps/templates/master/goat_type_add.html
      - apps/templates/master/goat_type_view.html
      - apps/templates/master/goat_type_update.html
      - apps/views.py
      - apps/forms.py
    entry_route: /master/goat-type/
    user_interactions:
      - View list of goat types in table
      - Click Add button to create new goat type
      - Fill goat_type_id (code like A, B, IST, SUP)
      - Fill goat_type_name (name like Grade A, Istimewa)
      - Fill display_order number
      - Toggle active status checkbox
      - Click Save to create new goat type
      - Click View on a row to see details
      - Click Edit on a row to update
      - Modify goat_type_name or display_order
      - Click Save to update
      - Click Delete on a row with confirmation dialog
      - Confirm deletion
    api_calls:
      - method: GET
        endpoint: /master/goat-type/
      - method: POST
        endpoint: /master/goat-type/add/
      - method: POST
        endpoint: /master/goat-type/update/<id>/
      - method: POST
        endpoint: /master/goat-type/delete/<id>/
    auth_required: true

known_limitations:
  - issue: Session timeout after 15 minutes of inactivity
    location: django-auto-logout middleware
    impact: Tests may fail if session expires during execution
  - issue: RBAC permissions may restrict access for certain user roles
    location: authentication/decorators.py
    impact: Some features may not be accessible depending on user permissions
